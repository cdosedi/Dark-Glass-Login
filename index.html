<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Login | Dark Glass Template</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="glass-card">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
        <span>Your Brand</span>
      </div>
      <h1>Sign in</h1>
      <p class="subtitle">Welcome back to your account</p>

      <form id="loginForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="22,6 12,13 2,6" />
            </svg>
            <input type="email" id="email" name="email" class="form-input" placeholder="name@domain.com" required autocomplete="email" />
          </div>
          <span class="error-message" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper position-relative">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input type="password" id="password" name="password" class="form-input password-input" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Toggle password visibility">
              <svg class="toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <span class="error-message" id="passwordError"></span>
        </div>

        <div class="form-group form-check">
          <input type="checkbox" id="rememberMe" name="rememberMe" class="form-checkbox" />
          <label for="rememberMe" class="form-check-label">Remember me</label>
          <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text">Sign in</span>
          <span class="btn-loader" aria-hidden="true"></span>
        </button>
      </form>

      <div class="divider"><span>Or continue with</span></div>

      <div class="social-login">
        <button type="button" class="social-btn social-google" data-provider="google">
          <img src="https://thesvg.org/icons/google/default.svg" alt="Google" class="social-icon" loading="lazy" />
          <span>Google</span>
        </button>
        <button type="button" class="social-btn social-github" data-provider="github">
          <img src="https://thesvg.org/icons/github/default.svg" alt="GitHub" class="social-icon" loading="lazy" />
          <span>GitHub</span>
        </button>
      </div>

      <div class="card-footer">
        <p class="footer-text">Don't have an account?</p>
        <a href="#" class="footer-link">Create an account</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
